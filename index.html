<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Peserta</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between text-slate-800">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-sm">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-clipboard-check text-xl"></i>
                <h1 class="font-bold text-base">Presensi Kehadiran</h1>
            </div>
            <button onclick="toggleView()" id="navBtn" class="text-xs bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg font-medium transition">
                <i class="fa-solid fa-list-check mr-1"></i> Lihat Data
            </button>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow">
        
        <!-- Borang Presensi -->
        <div id="formSection" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
            <div class="mb-4">
                <h2 class="font-bold text-lg text-slate-900">Sila Isi Kehadiran Anda</h2>
                <p class="text-xs text-slate-500 mt-0.5">Pastikan maklumat yang dimasukkan adalah betul.</p>
            </div>

            <form id="presenceForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">NIK</label>
                    <input type="text" id="nik" required placeholder="Contoh: 12345678" 
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Nama Lengkap</label>
                    <input type="text" id="nama" required placeholder="Contoh: Budi Santoso" 
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Bagian</label>
                    <input type="text" id="bagian" required placeholder="Contoh: Pemasaran / IT / HR" 
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Status Kehadiran</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="border border-slate-200 rounded-xl p-3 flex items-center space-x-2 cursor-pointer hover:bg-slate-50 transition">
                            <input type="radio" name="status" value="Hadir" required class="text-blue-600 focus:ring-blue-500">
                            <span class="text-sm font-medium text-emerald-700"><i class="fa-solid fa-circle-check mr-1"></i> Hadir</span>
                        </label>
                        <label class="border border-slate-200 rounded-xl p-3 flex items-center space-x-2 cursor-pointer hover:bg-slate-50 transition">
                            <input type="radio" name="status" value="Tidak Hadir" required class="text-blue-600 focus:ring-blue-500">
                            <span class="text-sm font-medium text-rose-700"><i class="fa-solid fa-circle-xmark mr-1"></i> Tidak Hadir</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition text-sm flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Hantar Presensi</span>
                </button>
            </form>
        </div>

        <!-- Senarai Data / Rekod -->
        <div id="dataSection" class="hidden space-y-4">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="font-bold text-lg text-slate-900">Rekod Kehadiran</h2>
                        <p class="text-xs text-slate-500">Jumlah: <span id="totalCount" class="font-semibold text-slate-700">0</span> orang</p>
                    </div>
                    <button onclick="downloadCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition flex items-center space-x-1">
                        <i class="fa-solid fa-file-excel"></i>
                        <span>CSV</span>
                    </button>
                </div>

                <div id="recordList" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                    <!-- Senarai data dimasukkan secara dinamik -->
                </div>

                <div id="emptyMsg" class="text-center py-10 text-slate-400 text-sm hidden">
                    <i class="fa-solid fa-folder-open text-2xl mb-1"></i>
                    <p>Belum ada data direkodkan.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Modal Notifikasi -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-xs w-full p-6 text-center space-y-3 shadow-lg">
            <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-lg">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 class="font-bold text-base text-slate-900">Berjaya Disimpan!</h3>
            <p class="text-xs text-slate-500">Kehadiran anda telah berjaya direkodkan.</p>
            <button onclick="closeModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium py-2.5 rounded-xl transition">
                Tutup
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400">
        &copy; 2026 Presensi Pintar Mobile
    </footer>

    <!-- Logik Skrip -->
    <script>
        let records = JSON.parse(localStorage.getItem('simple_attendance')) || [];
        let isViewMode = false;

        function toggleView() {
            isViewMode = !isViewMode;
            const formSec = document.getElementById('formSection');
            const dataSec = document.getElementById('dataSection');
            const navBtn = document.getElementById('navBtn');

            if (isViewMode) {
                formSec.classList.add('hidden');
                dataSec.classList.remove('hidden');
                navBtn.innerHTML = '<i class="fa-solid fa-pen-to-square mr-1"></i> Isi Borang';
                renderRecords();
            } else {
                dataSec.classList.add('hidden');
                formSec.classList.remove('hidden');
                navBtn.innerHTML = '<i class="fa-solid fa-list-check mr-1"></i> Lihat Data';
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            
            const nik = document.getElementById('nik').value.trim();
            const nama = document.getElementById('nama').value.trim();
            const bagian = document.getElementById('bagian').value.trim();
            const status = document.querySelector('input[name="status"]:checked').value;
            const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            const newEntry = { nik, nama, bagian, status, time };
            
            records.unshift(newEntry);
            localStorage.setItem('simple_attendance', JSON.stringify(records));

            document.getElementById('presenceForm').reset();
            document.getElementById('customModal').classList.remove('hidden');
            document.getElementById('customModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('customModal').classList.remove('flex');
            document.getElementById('customModal').classList.add('hidden');
            toggleView(); // Beralih otomatis ke senarai data
        }

        function renderRecords() {
            const listContainer = document.getElementById('recordList');
            const emptyMsg = document.getElementById('emptyMsg');
            const totalCount = document.getElementById('totalCount');

            totalCount.textContent = records.length;
            listContainer.innerHTML = '';

            if (records.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            } else {
                emptyMsg.classList.add('hidden');
            }

            records.forEach(item => {
                const statusBadge = item.status === 'Hadir' 
                    ? '<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs px-2 py-0.5 rounded-full font-medium">Hadir</span>'
                    : '<span class="bg-rose-50 text-rose-700 border border-rose-200 text-xs px-2 py-0.5 rounded-full font-medium">Tidak Hadir</span>';

                const card = document.createElement('div');
                card.className = 'p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-1.5';
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-slate-800 text-sm">${escapeHtml(item.nama)}</span>
                        ${statusBadge}
                    </div>
                    <div class="text-slate-500 flex justify-between">
                        <span>NIK: <strong class="text-slate-700">${escapeHtml(item.nik)}</strong></span>
                        <span>Bagian: <strong class="text-slate-700">${escapeHtml(item.bagian)}</strong></span>
                    </div>
                    <div class="text-[10px] text-slate-400 text-right pt-1">Waktu: ${item.time}</div>
                `;
                listContainer.appendChild(card);
            });
        }

        function downloadCSV() {
            if (records.length === 0) return;
            let csv = "NIK,Nama,Bagian,Status,Waktu\r\n";
            records.forEach(r => {
                csv += `"${r.nik}","${r.nama}","${r.bagian}","${r.status}","${r.time}"\r\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'data_kehadiran.csv';
            a.click();
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
